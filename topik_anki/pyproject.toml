[project]
name = "topik-anki"
version = "0.1.0"
description = "Pipeline that turns the TOPIK vocabulary list into an Anki deck: LLM-generated example phrases + TTS audio."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.72.0",
    "genanki>=0.13.1",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
# Local TTS via Qwen3-TTS. Requires a CUDA-capable GPU for reasonable speed.
qwen = [
    "qwen-tts",
    "soundfile",
    "torch",
]

[project.scripts]
topik-anki = "topik_anki.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/topik_anki"]
